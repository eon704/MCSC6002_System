# AMQP over TLS only; plain 5672 is closed. Server cert issued by the project CA (scripts/setup.sh).
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/tls/rabbitmq.crt
ssl_options.keyfile = /etc/rabbitmq/tls/rabbitmq.key
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
# Clients authenticate with username and password, not certificates.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
