<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Trust boundaries</text>

  <!-- Trust levels -->
  <text x="90" y="62" font-size="12" font-weight="bold" fill="#777" text-anchor="middle">UNTRUSTED</text>
  <text x="295" y="62" font-size="12" font-weight="bold" fill="#777" text-anchor="middle">EDGE</text>
  <text x="535" y="62" font-size="12" font-weight="bold" fill="#777" text-anchor="middle">TRUSTED SERVICES</text>
  <text x="840" y="62" font-size="12" font-weight="bold" fill="#777" text-anchor="middle">DATA AND MESSAGING</text>

  <!-- TB1: Internet -> Gateway (enforced) -->
  <line x1="185" y1="75" x2="185" y2="590" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="9,6"/>
  <text x="193" y="95" font-size="11" font-weight="bold" fill="#2e7d32">TB1</text>
  <!-- TB2: around services (enforced) -->
  <rect x="420" y="75" width="232" height="490" rx="10" fill="#f3faf3" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="9,6"/>
  <text x="432" y="95" font-size="11" font-weight="bold" fill="#2e7d32">TB2  mTLS: project CA, CN=api-gateway</text>
  <!-- TB4: data stores (weak) -->
  <rect x="700" y="75" width="282" height="240" rx="10" fill="#fff6f0" stroke="#c62828" stroke-width="2.5" stroke-dasharray="9,6"/>
  <text x="712" y="95" font-size="11" font-weight="bold" fill="#c62828">TB4  SQL TLS (cert not verified), Redis pwd</text>
  <!-- TB3: messaging (weak) -->
  <rect x="700" y="355" width="282" height="160" rx="10" fill="#fff6f0" stroke="#c62828" stroke-width="2.5" stroke-dasharray="9,6"/>
  <text x="712" y="375" font-size="11" font-weight="bold" fill="#c62828">TB3  plain AMQP, own user, unsigned</text>

  <!-- Nodes -->
  <rect x="30" y="290" width="125" height="60" rx="6" fill="#f4f4f4" stroke="#555"/>
  <text x="92" y="316" font-size="14" font-weight="bold" text-anchor="middle">Client</text>
  <text x="92" y="334" font-size="11" fill="#555" text-anchor="middle">any user / attacker</text>

  <rect x="220" y="280" width="150" height="80" rx="6" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="295" y="306" font-size="14" font-weight="bold" text-anchor="middle">API Gateway</text>
  <text x="295" y="324" font-size="11" fill="#555" text-anchor="middle">verify JWT (public key)</text>
  <text x="295" y="340" font-size="11" fill="#555" text-anchor="middle">permission per route</text>

  <rect x="445" y="120" width="182" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="536" y="146" font-size="14" font-weight="bold" text-anchor="middle">Identity Service</text>
  <text x="536" y="165" font-size="11" fill="#555" text-anchor="middle">holds RSA private key</text>

  <rect x="445" y="295" width="182" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="536" y="321" font-size="14" font-weight="bold" text-anchor="middle">Product Service</text>
  <text x="536" y="340" font-size="11" fill="#555" text-anchor="middle">re-checks JWT + permission</text>

  <rect x="445" y="470" width="182" height="60" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="536" y="496" font-size="14" font-weight="bold" text-anchor="middle">Inventory Service</text>
  <text x="536" y="515" font-size="11" fill="#555" text-anchor="middle">re-checks JWT + permission</text>

  <rect x="725" y="110" width="232" height="100" rx="6" fill="#fff" stroke="#8a6d3b"/>
  <text x="841" y="134" font-size="14" font-weight="bold" text-anchor="middle">SQL Server</text>
  <text x="841" y="155" font-size="11" fill="#555" text-anchor="middle">IdentityDB, ProductDB,</text>
  <text x="841" y="171" font-size="11" fill="#555" text-anchor="middle">InventoryDB (one per service)</text>
  <text x="841" y="190" font-size="11" fill="#555" text-anchor="middle">EF Core parameterized queries</text>

  <rect x="725" y="235" width="232" height="55" rx="6" fill="#fff" stroke="#8a6d3b"/>
  <text x="841" y="258" font-size="14" font-weight="bold" text-anchor="middle">Redis</text>
  <text x="841" y="276" font-size="11" fill="#555" text-anchor="middle">product cache, password auth</text>

  <rect x="725" y="400" width="232" height="60" rx="6" fill="#fff" stroke="#8a6d3b"/>
  <text x="841" y="425" font-size="14" font-weight="bold" text-anchor="middle">RabbitMQ</text>
  <text x="841" y="444" font-size="11" fill="#555" text-anchor="middle">ProductCreated / ProductDeleted</text>

  <!-- Flows -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <line x1="155" y1="320" x2="218" y2="320" marker-end="url(#a)"/>
    <line x1="370" y1="295" x2="443" y2="155" marker-end="url(#a)"/>
    <line x1="370" y1="320" x2="443" y2="325" marker-end="url(#a)"/>
    <line x1="370" y1="345" x2="443" y2="495" marker-end="url(#a)"/>
    <line x1="627" y1="150" x2="723" y2="150" marker-end="url(#a)"/>
    <line x1="627" y1="315" x2="723" y2="180" marker-end="url(#a)"/>
    <line x1="627" y1="485" x2="723" y2="198" marker-end="url(#a)"/>
    <line x1="627" y1="325" x2="723" y2="262" marker-end="url(#a)"/>
    <line x1="627" y1="345" x2="723" y2="420" marker-end="url(#a)"/>
    <line x1="723" y1="445" x2="629" y2="505" marker-end="url(#a)"/>
    <path d="M445,520 C380,590 300,560 295,362" stroke-dasharray="5,4" marker-end="url(#a)"/>
  </g>

  <!-- Boundary crossings -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="185" cy="320" r="11" fill="#2e7d32"/><text x="185" y="324" fill="#fff">1</text>
    <circle cx="420" cy="322" r="11" fill="#2e7d32"/><text x="420" y="326" fill="#fff">2</text>
    <circle cx="700" cy="150" r="11" fill="#c62828"/><text x="700" y="154" fill="#fff">4</text>
    <circle cx="700" cy="403" r="11" fill="#c62828"/><text x="700" y="407" fill="#fff">3</text>
    <circle cx="415" cy="544" r="11" fill="#2e7d32"/><text x="415" y="548" fill="#fff">5</text>
  </g>

  <!-- Boundary key -->
  <g font-size="11" fill="#222">
    <text x="30" y="612"><tspan font-weight="bold" fill="#2e7d32">1 TB1</tspan> Internet -> Gateway: HTTPS, JWT RS256 (15 min), permission claim per route.   <tspan font-weight="bold" fill="#2e7d32">2 TB2</tspan> Gateway -> services: mTLS + JWT re-check.</text>
    <text x="30" y="630"><tspan font-weight="bold" fill="#c62828">3 TB3</tspan> Services -> RabbitMQ: no TLS, no event signing yet.   <tspan font-weight="bold" fill="#c62828">4 TB4</tspan> Services -> SQL/Redis: SQL TLS without cert check, Redis unencrypted.</text>
    <text x="30" y="648"><tspan font-weight="bold" fill="#2e7d32">5 TB5</tspan> Inventory -> Gateway (product lookup): HTTPS + forwarded user JWT.   Green = enforced, red = weak.</text>
  </g>
</svg>
