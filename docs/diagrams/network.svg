<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Network diagram</text>

  <!-- Zones -->
  <rect x="20" y="50" width="185" height="520" rx="8" fill="#f4f4f4" stroke="#bbb"/>
  <text x="112" y="72" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">Internet</text>
  <rect x="225" y="50" width="200" height="520" rx="8" fill="#eaf2fb" stroke="#9bbbe0"/>
  <text x="325" y="72" font-size="13" font-weight="bold" fill="#355" text-anchor="middle">Edge (public)</text>
  <rect x="445" y="50" width="250" height="520" rx="8" fill="#eef7ee" stroke="#9ccc9c"/>
  <text x="570" y="72" font-size="13" font-weight="bold" fill="#353" text-anchor="middle">Internal services</text>
  <rect x="715" y="50" width="265" height="520" rx="8" fill="#fbf3e8" stroke="#e0c08f"/>
  <text x="847" y="72" font-size="13" font-weight="bold" fill="#653" text-anchor="middle">Data and messaging</text>

  <!-- Nodes -->
  <rect x="40" y="280" width="145" height="60" rx="6" fill="#fff" stroke="#555"/>
  <text x="112" y="305" font-size="14" font-weight="bold" text-anchor="middle">Client</text>
  <text x="112" y="324" font-size="11" fill="#555" text-anchor="middle">Browser / Postman</text>

  <rect x="250" y="270" width="150" height="80" rx="6" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="325" y="298" font-size="14" font-weight="bold" text-anchor="middle">API Gateway</text>
  <text x="325" y="316" font-size="11" fill="#555" text-anchor="middle">Ocelot, HTTPS :7000</text>
  <text x="325" y="333" font-size="11" fill="#555" text-anchor="middle">JWT + permission check</text>

  <rect x="480" y="110" width="180" height="70" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="570" y="138" font-size="14" font-weight="bold" text-anchor="middle">Identity Service</text>
  <text x="570" y="157" font-size="11" fill="#555" text-anchor="middle">HTTPS :7284, signs JWT</text>

  <rect x="480" y="275" width="180" height="70" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="570" y="303" font-size="14" font-weight="bold" text-anchor="middle">Product Service</text>
  <text x="570" y="322" font-size="11" fill="#555" text-anchor="middle">HTTPS :7280, publishes events</text>

  <rect x="480" y="440" width="180" height="70" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="570" y="468" font-size="14" font-weight="bold" text-anchor="middle">Inventory Service</text>
  <text x="570" y="487" font-size="11" fill="#555" text-anchor="middle">HTTPS :7148, consumes events</text>

  <rect x="745" y="95" width="205" height="115" rx="6" fill="#fff" stroke="#8a6d3b"/>
  <text x="847" y="120" font-size="14" font-weight="bold" text-anchor="middle">SQL Server :1433</text>
  <text x="847" y="145" font-size="11" fill="#555" text-anchor="middle">IdentityDB</text>
  <text x="847" y="165" font-size="11" fill="#555" text-anchor="middle">ProductDB</text>
  <text x="847" y="185" font-size="11" fill="#555" text-anchor="middle">InventoryDB</text>

  <rect x="745" y="245" width="205" height="50" rx="6" fill="#fff" stroke="#8a6d3b"/>
  <text x="847" y="267" font-size="14" font-weight="bold" text-anchor="middle">Redis :6379</text>
  <text x="847" y="284" font-size="11" fill="#555" text-anchor="middle">product query cache</text>

  <rect x="745" y="335" width="205" height="55" rx="6" fill="#fff" stroke="#8a6d3b"/>
  <text x="847" y="358" font-size="14" font-weight="bold" text-anchor="middle">RabbitMQ :5672</text>
  <text x="847" y="376" font-size="11" fill="#555" text-anchor="middle">MassTransit, product events</text>

  <!-- Links: green = encrypted, orange = not encrypted -->
  <line x1="185" y1="310" x2="248" y2="310" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="216" y="300" font-size="10" fill="#2e7d32" text-anchor="middle">HTTPS</text>

  <line x1="400" y1="285" x2="478" y2="150" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <line x1="400" y1="310" x2="478" y2="310" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <line x1="400" y1="335" x2="478" y2="465" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="440" y="300" font-size="10" fill="#2e7d32" text-anchor="middle">mTLS</text>

  <path d="M480,500 C420,540 340,470 330,352" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#g)"/>
  <text x="300" y="525" font-size="10" fill="#2e7d32">HTTPS + user JWT</text>
  <text x="300" y="538" font-size="10" fill="#2e7d32">(product lookup)</text>

  <line x1="660" y1="140" x2="743" y2="140" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>
  <line x1="660" y1="295" x2="743" y2="170" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>
  <line x1="660" y1="455" x2="743" y2="195" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>
  <text x="702" y="128" font-size="10" fill="#e65100" text-anchor="middle">TDS</text>

  <line x1="660" y1="305" x2="743" y2="272" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>
  <line x1="660" y1="330" x2="743" y2="358" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>
  <text x="703" y="362" font-size="10" fill="#e65100" text-anchor="middle">AMQP</text>
  <line x1="745" y1="385" x2="662" y2="475" stroke="#e65100" stroke-width="2" marker-end="url(#o)"/>

  <!-- Legend -->
  <line x1="40" y1="600" x2="80" y2="600" stroke="#2e7d32" stroke-width="2"/>
  <text x="88" y="604" font-size="11">Encrypted (HTTPS / mTLS)</text>
  <line x1="260" y1="600" x2="300" y2="600" stroke="#e65100" stroke-width="2"/>
  <text x="308" y="604" font-size="11">Weak (SQL TLS without cert check, plain AMQP, Redis)</text>
  <line x1="660" y1="600" x2="700" y2="600" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="708" y="604" font-size="11">Service-initiated call via gateway</text>
</svg>
