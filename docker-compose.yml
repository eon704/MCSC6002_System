# Local infrastructure only. The services run on the host with `dotnet run`.
# Credentials come from .env (never committed); see .env.example.
# Ports bind to 127.0.0.1 so nothing is reachable from the network.
name: mcsc6002

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5671:5671"   # AMQP over TLS
      - "127.0.0.1:15672:15672" # management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./rabbitmq/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
      - ../keys/tls/ca.crt:/etc/rabbitmq/tls/ca.crt:ro
      - ../keys/tls/rabbitmq.crt:/etc/rabbitmq/tls/rabbitmq.crt:ro
      - ../keys/tls/rabbitmq.key:/etc/rabbitmq/tls/rabbitmq.key:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  sqldata:
  rabbitdata:
